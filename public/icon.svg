    <rect x="0" y="80" width="40" height="120" rx="20" fill="#d79921"/>
    <rect x="60" y="40" width="40" height="200" rx="20" fill="#689d6a"/>
    <rect x="120" y="100" width="40" height="80" rx="20" fill="#fe8019"/>
